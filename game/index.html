<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Marisol Bay — a fan-made open-world crime game in the spirit of GTA 6: drive, steal cars, run seven story jobs and outrun the Marisol PD. Plays offline in a desktop browser.">
<title>Marisol Bay — an open-world crime game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🌴</text></svg>">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101623; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript p { color: #fff; font: 16px system-ui, sans-serif; padding: 2em; }
</style>
</head>
<body>
<canvas id="game" aria-label="Marisol Bay: drive, steal cars, run missions and outrun the Marisol PD in an open-world city"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p>Marisol Bay needs JavaScript to play.</p></noscript>
<script type="module" src="./src/boot.js"></script>
</body>
</html>

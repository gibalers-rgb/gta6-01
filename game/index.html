<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Heat — Open-world crime in Solara Bay</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #0b0e14; height: 100%;

  }

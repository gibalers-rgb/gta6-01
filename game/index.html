<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #14101c;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
  }
  #wrap {
    width: min(100vw, calc(100vh * 1.6));
    max-width: 1280px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: auto;
    background: #14101c;
    border-radius: 6px;
    box-shadow: 0 0 60px rgba(255, 126, 95, 0.25);
  }
  #note {
    color: #8a8496;
    font-size: 12px;
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="600"></canvas>
    <div id="note">Solmar Heat — a tiny open-world crime game. Keyboard only: WASD move &amp; drive, E steal a car, SHIFT run, P pause, M mute.</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
